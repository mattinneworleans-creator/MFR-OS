<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MFR//OS NEON RUNNER</title>

<style>
body {
    margin:0;
    background:#020306;
    color:#00eaff;
    font-family:Arial,sans-serif;
    text-align:center;
    overflow:hidden;
}

h1 {
    margin:6px 0 0;
    font-size:28px;
}

#version {
    font-size:13px;
    margin-bottom:5px;
}

button {
    padding:9px 18px;
    margin:3px;
    border:0;
    background:#00eaff;
    color:#020306;
    font-weight:bold;
    cursor:pointer;
    user-select:none;
}

input { display:none; }

audio {
    width:55%;
    height:26px;
    vertical-align:middle;
}

#info {
    margin:4px;
    font-size:14px;
}

#game {
    display:block;
    margin:6px auto;
    border:2px solid #00eaff;
    background:#020306;
    max-width:96vw;
    max-height:68vh;
}

.controls button {
    min-width:120px;
    font-size:18px;
}
</style>
</head>

<body>

<h1>MFR//OS</h1>
<div id="version">GAME 01 — MUSIC TERRAIN v2</div>

<input type="file" id="songFile" accept="audio/*">

<button id="choose">CHOOSE SONG</button>
<button id="play">PLAY</button>
<button id="pause">PAUSE</button>

<audio id="player" controls></audio>

<div id="info">
BASS: <span id="bass">0</span>% |
MID: <span id="mid">0</span>% |
HIGH: <span id="high">0</span>% |
ENERGY: <span id="energy">0</span>% |
<span id="status">READY</span>
</div>

<canvas id="game" width="800" height="450"></canvas>

<div class="controls">
<button id="left">◀ LEFT</button>
<button id="right">RIGHT ▶</button>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const player = document.getElementById("player");
const songFile = document.getElementById("songFile");

const bassText = document.getElementById("bass");
const midText = document.getElementById("mid");
const highText = document.getElementById("high");
const energyText = document.getElementById("energy");
const statusText = document.getElementById("status");

let audioContext;
let analyser;
let source;
let dataArray;
let songURL;

let bass = 0;
let mids = 0;
let highs = 0;
let energy = 0;
let smoothEnergy = 0;

let worldTime = 0;

/* =========================
   AUDIO
========================= */

document.getElementById("choose").onclick = () => {
    songFile.click();
};

songFile.onchange = () => {

    if (!songFile.files.length) return;

    if (songURL)
        URL.revokeObjectURL(songURL);

    songURL =
        URL.createObjectURL(songFile.files[0]);

    player.src = songURL;
    player.load();

    statusText.textContent = "SONG LOADED";
};

document.getElementById("play").onclick = async () => {

    try {

        if (!audioContext) {

            const AC =
                window.AudioContext ||
                window.webkitAudioContext;

            audioContext = new AC();

            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;
            analyser.smoothingTimeConstant = 0.72;

            source =
                audioContext.createMediaElementSource(player);

            source.connect(analyser);
            analyser.connect(audioContext.destination);

            dataArray =
                new Uint8Array(analyser.frequencyBinCount);
        }

        if (audioContext.state === "suspended")
            await audioContext.resume();

        await player.play();

        statusText.textContent = "RUNNING";

    } catch(err) {

        statusText.textContent =
            "ERROR: " + err.message;
    }
};

document.getElementById("pause").onclick = () => {

    player.pause();
    statusText.textContent = "PAUSED";
};


/* =========================
   FREQUENCY ANALYSIS
========================= */

function bandAverage(minHz,maxHz) {

    const sampleRate = audioContext.sampleRate;
    const binHz = sampleRate / analyser.fftSize;

    let start =
        Math.floor(minHz / binHz);

    let end =
        Math.ceil(maxHz / binHz);

    start =
        Math.max(0,start);

    end =
        Math.min(dataArray.length-1,end);

    let total = 0;
    let count = 0;

    for(let i=start;i<=end;i++) {
        total += dataArray[i];
        count++;
    }

    return count ?
        (total / count) / 255 :
        0;
}

function analyzeMusic() {

    if(!analyser)
        return;

    analyser.getByteFrequencyData(dataArray);

    bass =
        bandAverage(40,180);

    mids =
        bandAverage(180,2500);

    highs =
        bandAverage(2500,12000);

    energy =
        bass * 0.45 +
        mids * 0.35 +
        highs * 0.20;

    /*
       Slow energy measurement.
       Terrain responds gradually
       instead of jumping around.
    */

    smoothEnergy +=
        (energy - smoothEnergy) * 0.015;

    bassText.textContent =
        Math.round(bass*100);

    midText.textContent =
        Math.round(mids*100);

    highText.textContent =
        Math.round(highs*100);

    energyText.textContent =
        Math.round(smoothEnergy*100);
}


/* =========================
   MUSIC COLOR
========================= */

function musicColor(depth, brightness=1) {

    /*
       Bass pushes toward magenta/red.
       Mids move toward violet.
       Highs push toward cyan.

       Depth changes hue slightly so
       the road isn't one solid color.
    */

    let hue =
        190 +
        highs * 35 -
        bass * 110 +
        mids * 45 +
        depth * 30;

    hue =
        ((hue % 360) + 360) % 360;

    const saturation =
        70 + energy * 30;

    const lightness =
        Math.min(
            75,
            35 +
            energy * 35 +
            brightness * 10
        );

    return `hsl(${hue},${saturation}%,${lightness}%)`;
}


/* =========================
   STEERING
========================= */

let steering = 0;
let velocity = 0;

let leftHeld = false;
let rightHeld = false;

const ACCELERATION = 0.0035;
const FRICTION = 0.91;
const MAX_VELOCITY = 0.035;

function updateSteering() {

    if(leftHeld)
        velocity -= ACCELERATION;

    if(rightHeld)
        velocity += ACCELERATION;

    velocity *= FRICTION;

    velocity =
        Math.max(
            -MAX_VELOCITY,
            Math.min(MAX_VELOCITY,velocity)
        );

    steering += velocity;

    if(steering < -1) {
        steering = -1;
        velocity = 0;
    }

    if(steering > 1) {
        steering = 1;
        velocity = 0;
    }
}

document.addEventListener("keydown",e=>{

    if(e.key==="ArrowLeft" ||
       e.key.toLowerCase()==="a") {
        leftHeld=true;
        e.preventDefault();
    }

    if(e.key==="ArrowRight" ||
       e.key.toLowerCase()==="d") {
        rightHeld=true;
        e.preventDefault();
    }
});

document.addEventListener("keyup",e=>{

    if(e.key==="ArrowLeft" ||
       e.key.toLowerCase()==="a")
        leftHeld=false;

    if(e.key==="ArrowRight" ||
       e.key.toLowerCase()==="d")
        rightHeld=false;
});


function setupHoldButton(id,direction) {

    const button =
        document.getElementById(id);

    function down(e) {

        if(e)
            e.preventDefault();

        if(direction<0)
            leftHeld=true;
        else
            rightHeld=true;
    }

    function up(e) {

        if(e)
            e.preventDefault();

        if(direction<0)
            leftHeld=false;
        else
            rightHeld=false;
    }

    button.addEventListener("mousedown",down);
    button.addEventListener("mouseup",up);
    button.addEventListener("mouseleave",up);

    button.addEventListener("touchstart",down);
    button.addEventListener("touchend",up);
}

setupHoldButton("left",-1);
setupHoldButton("right",1);


/* =========================
   TERRAIN
========================= */

function curveAt(distance) {

    return (
        Math.sin(
            worldTime*0.22 +
            distance*4.2
        ) * 80 +

        Math.sin(
            worldTime*0.09 +
            distance*8.5
        ) * 30
    ) * distance;
}


function terrainHeight(distance) {

    /*
       Two large waves create
       actual hills and valleys.

       Music energy increases
       terrain amplitude.
    */

    const amplitude =
        45 +
        smoothEnergy * 120;

    const hill1 =
        Math.sin(
            worldTime*0.13 +
            distance*5.0
        );

    const hill2 =
        Math.sin(
            worldTime*0.055 +
            distance*9.0
        ) * 0.35;

    return (
        hill1 + hill2
    ) * amplitude;
}


function roadPoint(distance) {

    /*
       distance:
       0 = horizon
       1 = player
    */

    const perspective =
        distance * distance;

    const baseY =
        100 +
        perspective * 330;

    /*
       Terrain has much more
       visible effect in the
       middle/far road.
    */

    const terrainInfluence =
        Math.sin(distance * Math.PI);

    const elevation =
        terrainHeight(distance) *
        terrainInfluence;

    return {

        x:
            canvas.width/2 +
            curveAt(distance),

        y:
            baseY - elevation,

        width:
            35 +
            perspective * 310
    };
}


/* =========================
   DRAW ROAD
========================= */

function drawRoad() {

    const segments = 60;

    for(let i=0;i<segments;i++) {

        const d1 =
            i/segments;

        const d2 =
            (i+1)/segments;

        const p1 =
            roadPoint(d1);

        const p2 =
            roadPoint(d2);

        const color =
            musicColor(d1);

        ctx.strokeStyle = color;

        ctx.lineWidth =
            1.2 + d1*1.8;

        ctx.globalAlpha =
            0.22 + d1*0.78;


        /* LEFT EDGE */

        ctx.beginPath();

        ctx.moveTo(
            p1.x-p1.width,
            p1.y
        );

        ctx.lineTo(
            p2.x-p2.width,
            p2.y
        );

        ctx.stroke();


        /* RIGHT EDGE */

        ctx.beginPath();

        ctx.moveTo(
            p1.x+p1.width,
            p1.y
        );

        ctx.lineTo(
            p2.x+p2.width,
            p2.y
        );

        ctx.stroke();


        /* LANE DIVIDERS */

        ctx.globalAlpha *= 0.45;

        for(let lane of [-1,1]) {

            ctx.beginPath();

            ctx.moveTo(
                p1.x +
                lane*p1.width/3,
                p1.y
            );

            ctx.lineTo(
                p2.x +
                lane*p2.width/3,
                p2.y
            );

            ctx.stroke();
        }


        /*
           Cross lines.

           Offset with worldTime
           so road visibly moves.
        */

        const movingIndex =
            Math.floor(
                worldTime*20
            );

        if(
            (i+movingIndex)%4===0
        ) {

            ctx.globalAlpha =
                0.15 + d1*0.55;

            ctx.beginPath();

            ctx.moveTo(
                p1.x-p1.width,
                p1.y
            );

            ctx.lineTo(
                p1.x+p1.width,
                p1.y
            );

            ctx.stroke();
        }
    }

    ctx.globalAlpha=1;
}


/* =========================
   PLAYER
========================= */

function drawPlayer() {

    const p =
        roadPoint(0.92);

    const x =
        p.x +
        steering *
        p.width *
        0.72;

    const y =
        p.y - 12;

    const glow =
        15 + bass*35;

    ctx.shadowColor =
        musicColor(1);

    ctx.shadowBlur = glow;

    ctx.fillStyle="#ffffff";

    ctx.beginPath();

    ctx.moveTo(
        x,
        y-25
    );

    ctx.lineTo(
        x-20,
        y+18
    );

    ctx.lineTo(
        x+20,
        y+18
    );

    ctx.closePath();

    ctx.fill();

    ctx.shadowBlur=0;
}


/* =========================
   MUSIC PULSE
========================= */

function drawPulse() {

    if(bass < 0.55)
        return;

    const strength =
        (bass-0.55)/0.45;

    ctx.globalAlpha =
        strength*0.12;

    ctx.fillStyle =
        musicColor(0.5);

    ctx.fillRect(
        0,0,
        canvas.width,
        canvas.height
    );

    ctx.globalAlpha=1;
}


/* =========================
   LOOP
========================= */

function loop() {

    ctx.clearRect(
        0,0,
        canvas.width,
        canvas.height
    );

    analyzeMusic();
    updateSteering();

    /*
       Forward speed responds
       gently to overall energy.
    */

    const speed =
        0.018 +
        smoothEnergy*0.025;

    worldTime += speed;

    drawRoad();
    drawPlayer();
    drawPulse();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

</script>

</body>
</html>
