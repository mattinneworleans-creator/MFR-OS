<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MFR//OS Audio Test</title>

<style>
body {
    margin: 0;
    background: #05070a;
    color: #00eaff;
    font-family: Arial, sans-serif;
    text-align: center;
}

#screen {
    padding-top: 60px;
}

h1 {
    font-size: 60px;
}

#status {
    font-size: 22px;
    margin: 30px;
}

button {
    margin: 15px;
    padding: 20px 40px;
    font-size: 22px;
    background: #00eaff;
    color: #05070a;
    border: none;
    cursor: pointer;
}

input {
    display: none;
}

audio {
    display: block;
    width: 70%;
    margin: 30px auto;
}
</style>
</head>

<body>

<div id="screen">

    <h1>MFR//OS</h1>

    <p id="status">NO SONG LOADED</p>

    <input type="file"
           id="songFile"
           accept=".mp3,audio/mpeg,audio/*">

    <button id="chooseButton">CHOOSE SONG</button>

    <button id="playButton">PLAY SONG</button>

    <button id="pauseButton">PAUSE</button>

    <audio id="player" controls></audio>

</div>

<script>

const songFile = document.getElementById("songFile");
const chooseButton = document.getElementById("chooseButton");
const playButton = document.getElementById("playButton");
const pauseButton = document.getElementById("pauseButton");
const player = document.getElementById("player");
const status = document.getElementById("status");

let currentURL = null;

chooseButton.addEventListener("click", function() {
    songFile.click();
});

songFile.addEventListener("change", function() {

    if (!songFile.files.length) {
        return;
    }

    const song = songFile.files[0];

    if (currentURL) {
        URL.revokeObjectURL(currentURL);
    }

    currentURL = URL.createObjectURL(song);

    player.src = currentURL;
    player.load();

    status.textContent = "LOADED: " + song.name;
});

playButton.addEventListener("click", function() {

    if (!player.src) {
        status.textContent = "CHOOSE A SONG FIRST";
        return;
    }

    const result = player.play();

    if (result !== undefined) {
        result.then(function() {
            status.textContent = "NOW PLAYING";
        }).catch(function(error) {
            status.textContent = "PLAY ERROR: " + error.message;
        });
    }
});

pauseButton.addEventListener("click", function() {
    player.pause();
    status.textContent = "PAUSED";
});

player.addEventListener("error", function() {
    status.textContent = "AUDIO ERROR";
});

</script>

</body>
</html>
