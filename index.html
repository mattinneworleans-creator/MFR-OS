<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MFR//OS Web Audio Test</title>

<style>
body {
    margin: 0;
    background: #05070a;
    color: #00eaff;
    font-family: Arial, sans-serif;
    text-align: center;
}

#screen {
    padding-top: 50px;
}

h1 {
    font-size: 55px;
}

button {
    margin: 15px;
    padding: 20px 40px;
    font-size: 20px;
    background: #00eaff;
    color: #05070a;
    border: none;
    cursor: pointer;
}

#results {
    margin: 30px auto;
    width: 80%;
    font-size: 22px;
    line-height: 1.8;
    border: 2px solid #00eaff;
    padding: 20px;
}
</style>
</head>

<body>

<div id="screen">

<h1>MFR//OS</h1>

<p>FIRESTORM WEB AUDIO DIAGNOSTIC</p>

<button id="testButton">RUN TEST</button>

<div id="results">
WAITING FOR TEST
</div>

</div>

<script>

const results = document.getElementById("results");

document.getElementById("testButton").addEventListener("click", function() {

    let output = "";

    const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

    if (AudioContextClass) {
        output += "AudioContext: YES<br>";
    } else {
        output += "AudioContext: NO<br>";
        results.innerHTML = output;
        return;
    }

    try {

        const audioContext = new AudioContextClass();

        output += "AudioContext creation: YES<br>";

        if (typeof audioContext.createAnalyser === "function") {
            output += "createAnalyser: YES<br>";
        } else {
            output += "createAnalyser: NO<br>";
        }

        if (typeof audioContext.createMediaElementSource === "function") {
            output += "createMediaElementSource: YES<br>";
        } else {
            output += "createMediaElementSource: NO<br>";
        }

        output += "Audio state: " + audioContext.state + "<br>";

        audioContext.close();

    } catch (error) {

        output += "ERROR: " + error.message + "<br>";
    }

    results.innerHTML = output;

});

</script>

</body>
</html>
