<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MFR//OS</title>

<style>
body {
    margin: 0;
    background: #05070a;
    color: #00eaff;
    font-family: Arial, sans-serif;
    text-align: center;
}

#screen {
    padding-top: 80px;
}

h1 {
    font-size: 60px;
}

p {
    font-size: 24px;
}

button {
    margin-top: 30px;
    padding: 20px 50px;
    font-size: 24px;
    background: #00eaff;
    color: #05070a;
    border: none;
    cursor: pointer;
}

input {
    display: none;
}
</style>
</head>

<body>

<div id="screen">

<h1>MFR//OS</h1>

<p id="status">SELECT A SONG</p>

<input type="file" id="songFile" accept="audio/*">

<button onclick="document.getElementById('songFile').click()">
CHOOSE SONG
</button>

</div>

<script>

const songFile = document.getElementById("songFile");

songFile.addEventListener("change", function() {

    if (this.files.length > 0) {

        const song = this.files[0];

        document.getElementById("status").textContent =
            "SONG LOADED: " + song.name;

    }

});

</script>

</body>
</html>
