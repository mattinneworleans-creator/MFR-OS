<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MFR//OS Analyzer Test</title>

<style>
body {
    margin: 0;
    background: #05070a;
    color: #00eaff;
    font-family: Arial, sans-serif;
    text-align: center;
}

#screen {
    padding-top: 30px;
}

h1 {
    font-size: 52px;
    margin: 10px;
}

button {
    margin: 8px;
    padding: 15px 28px;
    font-size: 18px;
    background: #00eaff;
    color: #05070a;
    border: none;
    cursor: pointer;
}

input {
    display: none;
}

audio {
    display: block;
    width: 75%;
    margin: 15px auto;
}

canvas {
    display: block;
    width: 80%;
    height: 220px;
    margin: 15px auto;
    background: #020304;
    border: 2px solid #00eaff;
}

#diagnostic {
    font-size: 17px;
    margin: 10px;
}
</style>
</head>

<body>

<div id="screen">

<h1>MFR//OS</h1>

<p id="status">NO SONG LOADED</p>

<input type="file"
       id="songFile"
       accept=".mp3,audio/mpeg,audio/*">

<button id="chooseButton">CHOOSE SONG</button>
<button id="playButton">PLAY</button>
<button id="pauseButton">PAUSE</button>

<audio id="player" controls></audio>

<canvas id="visualizer" width="800" height="220"></canvas>

<p id="diagnostic">AUDIO ENGINE: WAITING</p>

</div>

<script>

const songFile = document.getElementById("songFile");
const chooseButton = document.getElementById("chooseButton");
const playButton = document.getElementById("playButton");
const pauseButton = document.getElementById("pauseButton");

const player = document.getElementById("player");
const status = document.getElementById("status");
const diagnostic = document.getElementById("diagnostic");

const canvas = document.getElementById("visualizer");
const ctx = canvas.getContext("2d");

let currentURL = null;

let audioContext = null;
let analyser = null;
let source = null;
let dataArray = null;

chooseButton.onclick = function() {
    songFile.click();
};

songFile.onchange = function() {

    if (!songFile.files.length) return;

    const song = songFile.files[0];

    if (currentURL) {
        URL.revokeObjectURL(currentURL);
    }

    currentURL = URL.createObjectURL(song);

    player.src = currentURL;
    player.load();

    status.textContent = "LOADED: " + song.name;
    diagnostic.textContent = "AUDIO ENGINE: SONG READY";
};

playButton.onclick = async function() {

    try {

        if (!audioContext) {

            const AudioContextClass =
                window.AudioContext ||
                window.webkitAudioContext;

            audioContext = new AudioContextClass();

            diagnostic.textContent =
                "AUDIO ENGINE: CONTEXT CREATED";

            analyser = audioContext.createAnalyser();

            analyser.fftSize = 256;
            analyser.smoothingTimeConstant = 0.75;

            diagnostic.textContent =
                "AUDIO ENGINE: ANALYSER CREATED";

            source =
                audioContext.createMediaElementSource(player);

            source.connect(analyser);
            analyser.connect(audioContext.destination);

            dataArray =
                new Uint8Array(analyser.frequencyBinCount);

            diagnostic.textContent =
                "AUDIO ENGINE: CONNECTED";

            draw();
        }

        if (audioContext.state === "suspended") {
            await audioContext.resume();
        }

        await player.play();

        status.textContent = "NOW PLAYING";
        diagnostic.textContent =
            "AUDIO ENGINE: ANALYZING";

    }

    catch(error) {

        diagnostic.textContent =
            "ERROR: " + error.message;
    }
};

pauseButton.onclick = function() {

    player.pause();

    status.textContent = "PAUSED";
};

function draw() {

    requestAnimationFrame(draw);

    if (!analyser || !dataArray) return;

    analyser.getByteFrequencyData(dataArray);

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const bars = 64;
    const barWidth = canvas.width / bars;

    for (let i = 0; i < bars; i++) {

        const value = dataArray[i];

        const height =
            (value / 255) * canvas.height;

        ctx.fillStyle = "#00eaff";

        ctx.fillRect(
            i * barWidth,
            canvas.height - height,
            barWidth - 2,
            height
        );
    }
}

</script>

</body>
</html>
