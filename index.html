<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MFR//OS</title>

<style>
body {
    margin: 0;
    background: #05070a;
    color: #00eaff;
    font-family: Arial, sans-serif;
    text-align: center;
}

#screen {
    padding-top: 70px;
}

h1 {
    font-size: 60px;
}

p {
    font-size: 22px;
}

button {
    margin: 15px;
    padding: 20px 45px;
    font-size: 22px;
    background: #00eaff;
    color: #05070a;
    border: none;
    cursor: pointer;
}

input {
    display: none;
}

#playButton {
    display: none;
}

audio {
    margin-top: 25px;
    width: 70%;
}
</style>
</head>

<body>

<div id="screen">

<h1>MFR//OS</h1>

<p id="status">SELECT A SONG</p>

<input type="file" id="songFile" accept="audio/*">

<button onclick="document.getElementById('songFile').click()">
CHOOSE SONG
</button>

<button id="playButton">
PLAY SONG
</button>

<br>

<audio id="player" controls></audio>

</div>

<script>

const songFile = document.getElementById("songFile");
const player = document.getElementById("player");
const playButton = document.getElementById("playButton");
const status = document.getElementById("status");

songFile.addEventListener("change", function() {

    if (this.files.length > 0) {

        const song = this.files[0];

        const songURL = URL.createObjectURL(song);

        player.src = songURL;

        status.textContent =
            "SONG LOADED: " + song.name;

        playButton.style.display = "inline-block";
    }

});

playButton.addEventListener("click", function() {

    player.play();

    status.textContent = "NOW PLAYING";

    playButton.textContent = "PLAYING";
});

</script>

</body>
</html>
